
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Setup | Cybersecurity</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #080d18;
            color: #e5edf7;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            background: #0b1220;
        }

        .logo {
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .status {
            color: #4ade80;
            font-size: 13px;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 65px 20px 40px;
        }

        .tag {
            display: inline-block;
            color: #38bdf8;
            border: 1px solid #164e63;
            background: #0c2535;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 48px);
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            color: #94a3b8;
            max-width: 650px;
            margin: auto;
            line-height: 1.8;
        }

        /* CONTENT */
        .container {
            max-width: 1100px;
            margin: 35px auto 80px;
            padding: 0 25px;
        }

        .section-title {
            margin-bottom: 25px;
        }

        .section-title h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* MEDIA CARDS */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .card {
            background: #111c2e;
            border: 1px solid #26364c;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 10px 35px #0284c733;
        }

        .card-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            font-size: 17px;
        }

        .card-header span {
            font-size: 11px;
            color: #38bdf8;
            background: #0c2535;
            padding: 5px 10px;
            border-radius: 20px;
        }

        /* IMAGE ET VIDEO : MEMES DIMENSIONS */
        .media {
            width: 100%;
            aspect-ratio: 576 / 464;
            background: #050a12;
            overflow: hidden;
        }

        .media img,
        .media video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-footer {
            padding: 15px 20px;
            color: #94a3b8;
            font-size: 13px;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 13px;
        }

        footer span {
            color: #38bdf8;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            header {
                padding: 20px;
            }

            .media-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding-top: 45px;
            }

            .container {
                padding: 0 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">CYBER<span style="color:white">LAB</span></div>
        <div class="status">● SYSTEM ONLINE</div>
    </header>

    <section class="hero">
        <div class="tag">LABORATORY</div>

        <h1>Welcome to <span>My Setup</span></h1>

        <p>
            Discover my environment
        </p>
    </section>

    <main class="container">

        <div class="section-title">
            <h2>My Environment</h2>
            <p>A visual overview of my cybersecurity setup.</p>
        </div>

        <div class="media-grid">

           

            <!-- VIDEO -->
            <div class="card">
                <div class="card-header">
                    <h3>Favorite Game</h3>
                    <span>VIDEO</span>
                </div>

                <div class="media">
                    <video controls preload="metadata"
                           poster="avatar.png">
                        <source src="setup.mp4" type="video/mp4">
                        Votre navigateur ne supporte pas la lecture vidéo.
                    </video>
                </div>

                <div class="card-footer">
                    A walkthrough of my setup and configuration.
                </div>
            </div>

        </div>
    </main>

    <footer>
        Designed with <span>♥</span> | Cybersecurity Lab © 2026
    </footer>

</body>
</html>
